# Banco de dados local para desenvolvimento.
# Uso: docker compose up -d   (liga)  |  docker compose down   (desliga)
services:
  db:
    image: postgres:18-alpine
    container_name: conecta-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # A partir do PostgreSQL 18, o volume é montado em /var/lib/postgresql
      - conecta_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  conecta_pgdata:
    name: conecta_pgdata
