# Configuração do Alembic (migrações do banco).
# Uso, a partir da raiz do projeto:
#   alembic -c db/alembic.ini upgrade head      (aplica todas as migrações)
#   alembic -c db/alembic.ini downgrade -1      (desfaz a última)
#   alembic -c db/alembic.ini current           (mostra a versão atual)
# A conexão vem da DATABASE_URL (.env ou variável de ambiente), ver migrations/env.py.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
# Separa caminhos pelo separador do sistema, não por espaços
# (o caminho do projeto pode conter espaços, ex.: "windows 11 pro").
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
