# Integração contínua: roda todos os testes a cada push e pull request.
name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Banco, ETL e API (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: conecta
          POSTGRES_PASSWORD: conecta
          POSTGRES_DB: conecta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U conecta -d conecta"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Os testes criam e usam o banco conecta_test neste PostgreSQL temporário
      DATABASE_URL: postgresql://conecta:conecta@localhost:5432/conecta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: "**/requirements.txt"
      - run: pip install -r db/requirements.txt -r etl/requirements.txt -r backend/requirements.txt
      - run: python -m pytest -q

  frontend:
    name: Site (React)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
