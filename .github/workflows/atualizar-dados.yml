# Atualização automática dos dados da ANP (RF13, CLAUDE.md seção 9.1).
# Se falhar, o site continua no ar com os dados anteriores e o GitHub avisa por e-mail.
name: Atualizar dados ANP

on:
  schedule:
    - cron: "0 9 * * 1" # toda segunda, 06h de Brasília (o cron é em UTC)
  workflow_dispatch: # permite rodar manualmente pela aba Actions

# Nunca duas atualizações ao mesmo tempo
concurrency:
  group: atualizar-dados
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  etl:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - run: pip install -r etl/requirements.txt
      # Produção mantém só os últimos 24 meses (cabe no plano gratuito do Neon)
      - run: python -m etl.atualizar --manter-meses 24
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
